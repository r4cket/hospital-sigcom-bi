# ============================================================================
#  Stack COMPLETO del proyecto. Requiere una maquina con Docker (VM / VPS).
#  Extiende docker-compose.yml (postgres + grafana + caddy) con:
#
#    loader   -> carga automatica del Cubo 9: dejas el .xlsx en data/incoming/
#                y lo sube a Postgres solo (schema + datos), con control de
#                cuadratura. Reemplaza el paso manual load_excel.py + psql.
#    dbt      -> pruebas de calidad de datos sobre la base (perfil "quality").
#                Falla si algo no cuadra; avisa en anomalias conocidas.
#    renderer -> motor de imagenes de Grafana. Habilita PNG / PDF del tablero.
#    reporter -> envia el tablero por correo segun un cron (ej. dia 5 de cada mes).
#
#  Uso:
#    cp .env.full.example .env      # y completar
#    docker compose -f docker-compose.full.yml up -d
#    docker compose -f docker-compose.full.yml --profile quality run --rm dbt
#    docker compose -f docker-compose.full.yml run --rm reporter now   # prueba
# ============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: hbi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    build: .
    container_name: hbi_grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${DOMAIN}
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: ${PG_DATABASE}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_SSLMODE: disable
      # --- motor de render (para PNG/PDF del tablero) ---
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_LOG_FILTERS: rendering:info
      # --- SMTP para alertas propias de Grafana (opcional; mismo correo) ---
      GF_SMTP_ENABLED: ${SMTP_ENABLED:-false}
      GF_SMTP_HOST: "${SMTP_HOST:-}:${SMTP_PORT:-587}"
      GF_SMTP_USER: ${SMTP_USER:-}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${MAIL_FROM:-}
    expose:
      - "3000"

  renderer:
    image: grafana/grafana-image-renderer:3.11.6
    container_name: hbi_renderer
    restart: unless-stopped
    environment:
      ENABLE_METRICS: "false"
    expose:
      - "8081"

  caddy:
    image: caddy:2-alpine
    container_name: hbi_caddy
    restart: unless-stopped
    depends_on:
      - grafana
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  loader:
    build: ./loader
    container_name: hbi_loader
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: ${PG_DATABASE}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PGSSLMODE: disable
      MODE: watch
      POLL_SECONDS: ${POLL_SECONDS:-30}
      STRICT: ${STRICT:-0}
    volumes:
      - ./data/incoming:/incoming
      - ./data/processed:/processed
      - ./data/failed:/failed
      - ./postgres/init:/schema:ro

  reporter:
    build: ./reporter
    container_name: hbi_reporter
    restart: unless-stopped
    depends_on:
      - grafana
      - renderer
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_USER: admin
      GRAFANA_PASSWORD: ${GF_ADMIN_PASSWORD}
      DASHBOARD_UID: hospital-financial-kpis
      DASHBOARD_SLUG: kpis-financieros
      REPORT_CRON: "${REPORT_CRON:-0 8 5 * *}"
      REPORT_TZ: "${REPORT_TZ:-America/Santiago}"
      TZ: "${REPORT_TZ:-America/Santiago}"
      REPORT_FROM: ${REPORT_FROM:-now-13M}
      REPORT_TO: ${REPORT_TO:-now}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_TO: ${MAIL_TO:-}

  dbt:
    build: ./dbt
    container_name: hbi_dbt
    profiles: ["quality"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: ${PG_DATABASE}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_SSLMODE: disable

volumes:
  pg_data:
  caddy_data:
  caddy_config:
